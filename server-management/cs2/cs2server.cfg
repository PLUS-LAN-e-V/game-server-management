##################################
######## Instance Settings ########
##################################
# LinuxGSM instance config, mounted read-only into every CS2 container at
# /data/config-lgsm/cs2server/cs2server.cfg. Sourced by bash after _default.cfg.
# https://docs.linuxgsm.com/configuration/linuxgsm-config

# RCON: CS2 only accepts RCON (TCP on the game port) when started with -usercon.
# The password comes from the cs2_rcon_password compose secret (CS2_RCON_PASSWORD in .env).
# Read from a file rather than an env var so LinuxGSM's cron update/restart sees it too.
rconpassword="$(cat /run/secrets/cs2_rcon_password)"

startparameters="-dedicated -ip ${ip} -port ${port} -maxplayers ${maxplayers} -authkey ${wsapikey} -usercon +rcon_password ${rconpassword} +exec ${selfname}.cfg"
